  "ErdosSzekeres.ctx_unit_axis_active_region_potential": {
    "type_hash": "c88df2f35ee32c75",
    "type_pp": "∀ (σ : ErdosSzekeres.Ctx.Context),\n  (∀ (x l : Nat) (t : ErdosSzekeres.Ctx.Side),\n      Eq (σ.letterAt x) (ErdosSzekeres.Ctx.Letter.ext l t) → instLENat.le 1 l) →\n    ∀ (s : ErdosSzekeres.Ctx.Side),\n      (∀ (p : Nat),\n          List.instMembership.mem σ.childPositions p →\n            instLENat.le\n              (ErdosSzekeres.ctx_unit_axis_active_region_potential.match_1 (fun s => Nat) s\n                (fun _ => σ.cupLimit p p) fun _ => σ.capLimit p p)\n              1) →\n        have markers := (σ.levelsOn s 0).toFinset.biUnion fun l => (σ.extPositions l).toFinset;\n        have active :=\n          Finset.filter\n            (fun p => And (instLTNat.lt 0 (σ.cupLimit p p)) (instLTNat.lt 0 (σ.capLimit p p)))\n            σ.childPositions.toFinset;\n        have regions :=\n          (Finset.image (fun p => (Finset.filter (fun x => instLTNat.lt x p) markers).card)\n              active).card;\n        And (∀ (fuel : Nat), instLENat.le (ErdosSzekeres.Ctx.Context.boundFuel fuel σ) regions)\n          (And (instLENat.le σ.bound regions) (instLENat.le regions σ.numRuns))",
    "approved_by": "user:2026-09-08 timed autonomous lemma-driven Goal-mode pilot",
    "approved_at": "2026-09-08",
    "kind": "formalization",
    "ws": "B",
    "module": "ESBlueprint.B.CtxUnitAxisActiveRegionPotential"
  },
  "ErdosSzekeres.ctx_unit_axis_region_potential_additive": {
    "type_hash": "247d8d5c72e889cf",
    "type_pp": "∀ (σ : ErdosSzekeres.Ctx.Context),\n  (∀ (x l : Nat) (t : ErdosSzekeres.Ctx.Side),\n      Eq (σ.letterAt x) (ErdosSzekeres.Ctx.Letter.ext l t) → instLENat.le 1 l) →\n    ∀ (s : ErdosSzekeres.Ctx.Side),\n      (∀ (p : Nat),\n          List.instMembership.mem σ.childPositions p →\n            instLENat.le\n              (ErdosSzekeres.ctx_unit_axis_region_potential_additive.match_1 (fun s => Nat) s\n                (fun _ => σ.cupLimit p p) fun _ => σ.capLimit p p)\n              1) →\n        ∀ (keep rest : List Nat) (t : ErdosSzekeres.Ctx.Side) (m n : Nat),\n          (∀ (p : Nat),\n              List.instMembership.mem σ.childPositions p →\n                List.instMembership.mem keep p → Not (List.instMembership.mem rest p)) →\n            have regions := fun ρ =>\n              have markers :=\n                (ρ.levelsOn s 0).toFinset.biUnion fun l => (ρ.extPositions l).toFinset;\n              have active :=\n                Finset.filter\n                  (fun p => And (instLTNat.lt 0 (ρ.cupLimit p p)) (instLTNat.lt 0 (ρ.capLimit p p)))\n                  ρ.childPositions.toFinset;\n              (Finset.image (fun p => (Finset.filter (fun x => instLTNat.lt x p) markers).card)\n                  active).card;\n            instLENat.le (instHAdd.hAdd (regions (σ.part keep s m)) (regions (σ.part rest t n)))\n              (regions σ)",
    "approved_by": "user:2026-09-08 timed autonomous lemma-driven Goal-mode pilot",
    "approved_at": "2026-09-08",
    "kind": "formalization",
    "ws": "B",
    "module": "ESBlueprint.B.CtxUnitAxisRegionPotentialAdditive"
  },
