    "type_pp": "have σ :=\n  { a := 5, u := 5, k := 6,\n    word :=\n      List.cons ErdosSzekeres.Ctx.Letter.child\n        (List.cons ErdosSzekeres.Ctx.Letter.child\n          (List.cons (ErdosSzekeres.Ctx.Letter.ext 1 ErdosSzekeres.Ctx.Side.upper)\n            (List.cons ErdosSzekeres.Ctx.Letter.child\n              (List.cons ErdosSzekeres.Ctx.Letter.child List.nil)))),\n    maxima := List.cons 1 List.nil };\nhave τ :=\n  { a := σ.a, u := σ.u, k := σ.k,\n    word :=\n      List.cons ErdosSzekeres.Ctx.Letter.child\n        (List.cons ErdosSzekeres.Ctx.Letter.child\n          (List.cons (ErdosSzekeres.Ctx.Letter.ext 1 ErdosSzekeres.Ctx.Side.upper)\n            (List.cons ErdosSzekeres.Ctx.Letter.child List.nil))),\n    maxima := σ.maxima };\nAnd σ.WellFormed\n  (And τ.WellFormed\n    (instLTNat.lt\n      (instHAdd.hAdd\n        (τ.part (List.cons 0 (List.cons 3 List.nil)) ErdosSzekeres.Ctx.Side.lower 1).bound\n        (τ.part (List.cons 1 List.nil) ErdosSzekeres.Ctx.Side.upper 4).bound)\n      (instHAdd.hAdd\n        (σ.part (List.cons 0 (List.cons 3 (List.cons 4 List.nil))) ErdosSzekeres.Ctx.Side.lower\n            1).bound\n        (σ.part (List.cons 1 List.nil) ErdosSzekeres.Ctx.Side.upper 4).bound)))",
