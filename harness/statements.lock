    "type_pp": "∀ (σ : ErdosSzekeres.Ctx.Context),\n  (∀ (x l : Nat) (v : ErdosSzekeres.Ctx.Side),\n      Eq (σ.letterAt x) (ErdosSzekeres.Ctx.Letter.ext l v) → instLENat.le 1 l) →\n    ∀ (s t : ErdosSzekeres.Ctx.Side),\n      Ne s t →\n        instLENat.le\n            (ErdosSzekeres.ctx_small_global_axis_rank_region_potential.match_1 (fun s => Nat) s\n              (fun _ => σ.u) fun _ => σ.a)\n            3 →\n          have markers := fun ρ =>\n            (ρ.levelsOn s 0).toFinset.biUnion fun l => (ρ.extPositions l).toFinset;\n          have active := fun ρ =>\n            Finset.filter\n              (fun p => And (instLTNat.lt 0 (ρ.cupLimit p p)) (instLTNat.lt 0 (ρ.capLimit p p)))\n              ρ.childPositions.toFinset;\n          have budget := fun ρ =>\n            ErdosSzekeres.ctx_small_global_axis_rank_region_potential.match_1 (fun t => Nat) t\n              (fun _ => instHSub.hSub ρ.u 1) fun _ => instHSub.hSub ρ.a 1;\n          have ranks := fun ρ =>\n            (active ρ).biUnion fun p =>\n              Finset.Icc (instHAdd.hAdd (ρ.leftExt t 0 p) 1)\n                (instHSub.hSub (budget ρ) (ρ.rightExt t 0 p));\n          have regions := fun ρ =>\n            (Finset.image (fun p => (Finset.filter (fun x => instLTNat.lt x p) (markers ρ)).card)\n                (active ρ)).card;\n          have potential := fun ρ =>\n            ite (Eq (markers ρ) Finset.instEmptyCollection.emptyCollection) (ranks ρ).card\n              (instMinNat.min (regions ρ) (ranks ρ).card);\n          And\n            (∀ (fuel : Nat),\n              instLENat.le (ErdosSzekeres.Ctx.Context.boundFuel fuel σ) (potential σ))\n            (And (instLENat.le σ.bound (potential σ))\n              (And (instLENat.le (potential σ) (budget σ))\n                (∀ (keep rest : List Nat) (m n : Nat),\n                  (∀ (p : Nat),\n                      List.instMembership.mem σ.childPositions p →\n                        List.instMembership.mem keep p → Not (List.instMembership.mem rest p)) →\n                    instLENat.le\n                      (instHAdd.hAdd (potential (σ.part keep s m)) (potential (σ.part rest t n)))\n                      (potential σ))))",
