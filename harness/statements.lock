  "ErdosSzekeres.ctx_single_run_part_limits_exact": {
    "type_hash": "708d2359f68388cc",
    "type_pp": "∀ (σ : ErdosSzekeres.Ctx.Context),\n  σ.WellFormed →\n    ∀ (b N : Nat),\n      Eq σ.childPositions (List.range' b N) →\n        ∀ (keep : List Nat),\n          (Exists fun r =>\n              And (List.instMembership.mem σ.childPositions r)\n                (Not (List.instMembership.mem keep r))) →\n            ∀ (p q : Nat),\n              List.instMembership.mem σ.childPositions p →\n                List.instMembership.mem σ.childPositions q →\n                  ∀ (m : Nat),\n                    have removed :=\n                      List.filter (fun x => Decidable.decide (Not (List.instMembership.mem keep x)))\n                        σ.childPositions;\n                    have cost :=\n                      instHAdd.hAdd\n                        (ite\n                          (Eq\n                            (List.filter (fun x => Decidable.decide (instLTNat.lt x p))\n                                removed).isEmpty\n                            Bool.true)\n                          0 1)\n                        (ite\n                          (Eq\n                            (List.filter (fun x => Decidable.decide (instLTNat.lt q x))\n                                removed).isEmpty\n                            Bool.true)\n                          0 1);\n                    And\n                      (Eq ((σ.part keep ErdosSzekeres.Ctx.Side.lower m).cupLimit p q)\n                        (instMinNat.min (instHSub.hSub (σ.cupLimit p q) cost)\n                          (instHSub.hSub (instHSub.hSub σ.k 1) m)))\n                      (Eq ((σ.part keep ErdosSzekeres.Ctx.Side.upper m).capLimit p q)\n                        (instMinNat.min (instHSub.hSub (σ.capLimit p q) cost)\n                          (instHSub.hSub (instHSub.hSub σ.k 1) m)))",
