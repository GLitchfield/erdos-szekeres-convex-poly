  "ErdosSzekeres.ctx_bound_additive_prefix_suffix": {
    "type_hash": "9878c1ec6060b981",
    "type_pp": "∀ (σ : ErdosSzekeres.Ctx.Context),\n  σ.WellFormed →\n    ∀ (b l r : Nat),\n      Eq σ.childPositions (List.range' b (instHAdd.hAdd l r)) →\n        instLTNat.lt 0 l →\n          instLTNat.lt 0 r →\n            ∀ (d : Nat),\n              instLENat.le 1 d →\n                instLENat.le d (instHSub.hSub σ.k 2) →\n                  And\n                    (instLENat.le\n                      (instHAdd.hAdd (σ.part (List.range' b l) ErdosSzekeres.Ctx.Side.lower d).bound\n                        (σ.part (List.range' (instHAdd.hAdd b l) r) ErdosSzekeres.Ctx.Side.upper\n                            (instHSub.hSub (instHSub.hSub σ.k 1) d)).bound)\n                      σ.bound)\n                    (instLENat.le\n                      (instHAdd.hAdd\n                        (σ.part (List.range' b l) ErdosSzekeres.Ctx.Side.upper\n                            (instHSub.hSub (instHSub.hSub σ.k 1) d)).bound\n                        (σ.part (List.range' (instHAdd.hAdd b l) r) ErdosSzekeres.Ctx.Side.lower\n                            d).bound)\n                      σ.bound)",
    "approved_by": "codex:01a07c5a-4a94-7173-865c-d990c69ab997",
    "approved_at": "2026-09-07",
    "kind": "formalization",
    "ws": "B",
