  "ErdosSzekeres.ctx_mixed_exchange_of_ordered_limits": {
    "type_hash": "95d8f32d5ba999a1",
    "type_pp": "∀ (σ : ErdosSzekeres.Ctx.Context),\n  σ.WellFormed →\n    ∀ (p q : Nat),\n      List.instMembership.mem σ.childPositions p →\n        List.instMembership.mem σ.childPositions q →\n          Ne p q →\n            (Exists fun r =>\n                And (List.instMembership.mem σ.childPositions r) (And (Ne r p) (Ne r q))) →\n              ∀ (d e : Nat),\n                instLENat.le 1 d →\n                  instLENat.le d (instHSub.hSub σ.k 2) →\n                    instLENat.le 1 e →\n                      instLENat.le e (instHSub.hSub σ.k 2) →\n                        ∀ (c t : Nat),\n                          instLENat.le (instHAdd.hAdd c t) (instHSub.hSub σ.k 1) →\n                            instLENat.le (σ.cupLimit q q) (σ.capLimit p p) →\n                              have Rq :=\n                                σ.part\n                                  (List.filter\n                                    (fun x =>\n                                      Decidable.decide\n                                        (Not (List.instMembership.mem (List.cons q List.nil) x)))\n                                    σ.childPositions)\n                                  ErdosSzekeres.Ctx.Side.lower d;\n                              have Rp :=\n                                σ.part\n                                  (List.filter\n                                    (fun x =>\n                                      Decidable.decide\n                                        (Not (List.instMembership.mem (List.cons p List.nil) x)))\n                                    σ.childPositions)\n                                  ErdosSzekeres.Ctx.Side.upper\n                                  (instHSub.hSub (instHSub.hSub σ.k 1) e);\n                              have A :=\n                                σ.part (List.cons q List.nil) ErdosSzekeres.Ctx.Side.upper\n                                  (instHSub.hSub (instHSub.hSub σ.k 1) d);\n                              have B :=\n                                Rq.part (List.cons p List.nil) ErdosSzekeres.Ctx.Side.lower e;\n                              have A' :=\n                                Rp.part (List.cons q List.nil) ErdosSzekeres.Ctx.Side.upper\n                                  (instHSub.hSub (instHSub.hSub σ.k 1) d);\n                              have B' :=\n                                σ.part (List.cons p List.nil) ErdosSzekeres.Ctx.Side.lower e;\n                              have rest :=\n                                List.filter\n                                  (fun x =>\n                                    Decidable.decide\n                                      (And (Not (List.instMembership.mem (List.cons q List.nil) x))\n                                        (Not (List.instMembership.mem (List.cons p List.nil) x))))\n                                  σ.childPositions;\n                              instLENat.le (A.capLimit q q) (instHAdd.hAdd c t) →\n                                instLENat.le c (A'.capLimit q q) →\n                                  instLENat.le (B.cupLimit p p) c →\n                                    instLENat.le (instHAdd.hAdd c t) (B'.cupLimit p p) →\n                                      instLENat.le\n                                        (instHAdd.hAdd (instHAdd.hAdd A.bound B.bound)\n                                          (Rq.part rest ErdosSzekeres.Ctx.Side.upper\n                                              (instHSub.hSub (instHSub.hSub σ.k 1) e)).bound)\n                                        (instHAdd.hAdd (instHAdd.hAdd B'.bound A'.bound)\n                                          (Rp.part rest ErdosSzekeres.Ctx.Side.lower d).bound)",
