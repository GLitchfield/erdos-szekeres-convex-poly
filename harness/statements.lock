                       ErdosSzekeres.Ctx.Side.upper\n                                      (instHSub.hSub (instHSub.hSub σ.k 1) d')).bound)))))\n                    (Exists fun I =>\n                      Exists fun d' =>\n                        And\n                          (Exists fun j =>\n                            And (instLTNat.lt 0 j)\n                              (And (instLTNat.lt j σ.childPositions.length)\n                                (Or (Eq I (List.take j σ.childPositions))\n                                  (Eq I (List.drop j σ.childPositions)))))\n                          (And (instLENat.le 1 d')\n                            (And (instLENat.le d' (instHSub.hSub σ.k 2))\n                              (instLENat.le\n                                (instHAdd.hAdd\n                                  (σ.part keep ErdosSzekeres.Ctx.Side.upper\n                                      (instHSub.hSub (instHSub.hSub σ.k 1) d)).bound\n                                  (σ.part\n                                      (List.filter\n                                        (fun p =>\n                                          Decidable.decide (Not (List.instMembership.mem keep p)))\n                                        σ.childPositions)\n                                      ErdosSzekeres.Ctx.Side.lower d).bound)\n                                (instHAdd.hAdd\n                                  (σ.part I ErdosSzekeres.Ctx.Side.upper\n                                      (instHSub.hSub (instHSub.hSub σ.k 1) d')).bound\n                                  (σ.part\n                                      (List.filter\n                                        (fun p =>\n                                          Decidable.decide (Not (List.instMembership.mem I p)))\n                                        σ.childPositions)\n                                      ErdosSzekeres.Ctx.Side.lower d').bound)))))",
