    "type_pp": "∀ (σ τ : ErdosSzekeres.Ctx.Context),\n  (∀ (p j : Nat) (v : ErdosSzekeres.Ctx.Side),\n      Eq (σ.letterAt p) (ErdosSzekeres.Ctx.Letter.ext j v) → instLENat.le 1 j) →\n    (∀ (p j : Nat) (v : ErdosSzekeres.Ctx.Side),\n        Eq (τ.letterAt p) (ErdosSzekeres.Ctx.Letter.ext j v) → instLENat.le 1 j) →\n      instLENat.le σ.a τ.a →\n        instLENat.le σ.u τ.u →\n          Eq σ.k τ.k →\n            Eq σ.word.length τ.word.length →\n              (∀ (p : Nat),\n                  Iff (Eq (σ.letterAt p) ErdosSzekeres.Ctx.Letter.child)\n                    (Eq (τ.letterAt p) ErdosSzekeres.Ctx.Letter.child)) →\n                Eq σ.maxima.length τ.maxima.length →\n                  (∀ (j : Nat),\n                      List.instMembership.mem σ.levels j →\n                        And (Eq (τ.sideAt j) (σ.sideAt j))\n                          (And (List.instHasSubset.Subset (τ.extPositions j) (σ.extPositions j))\n                            (instLENat.le (τ.maximumAt j) (σ.maximumAt j)))) →\n                    And\n                      (∀ (p q : Nat),\n                        And (instLENat.le (σ.cupLimit p q) (τ.cupLimit p q))\n                          (instLENat.le (σ.capLimit p q) (τ.capLimit p q)))\n                      (And\n                        (∀ (fuel : Nat),\n                          instLENat.le (ErdosSzekeres.Ctx.Context.boundFuel fuel σ)\n                            (ErdosSzekeres.Ctx.Context.boundFuel fuel τ))\n                        (instLENat.le σ.bound τ.bound))",
