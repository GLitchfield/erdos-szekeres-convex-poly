  "ErdosSzekeres.ctx_bound_same_size_exchange_counterexample": {
    "type_hash": "f927fd18680f3854",
    "type_pp": "have σ :=\n  { a := 4, u := 4, k := 5,\n    word :=\n      List.cons ErdosSzekeres.Ctx.Letter.child\n        (List.cons ErdosSzekeres.Ctx.Letter.child\n          (List.cons (ErdosSzekeres.Ctx.Letter.ext 1 ErdosSzekeres.Ctx.Side.lower)\n            (List.cons ErdosSzekeres.Ctx.Letter.child\n              (List.cons ErdosSzekeres.Ctx.Letter.child List.nil)))),\n    maxima := List.cons 1 List.nil };\nhave keep := List.cons 0 (List.cons 3 List.nil);\nhave value := fun block =>\n  instHAdd.hAdd (σ.part block ErdosSzekeres.Ctx.Side.upper 1).bound\n    (σ.part\n        (List.filter (fun p => Decidable.decide (Not (List.instMembership.mem block p)))\n          σ.childPositions)\n        ErdosSzekeres.Ctx.Side.lower 3).bound;\nAnd σ.WellFormed\n  (And (Eq σ.childPositions (List.cons 0 (List.cons 1 (List.cons 3 (List.cons 4 List.nil)))))\n    (And (Eq σ.numRuns 2)\n      (And (Not (List.instMembership.mem σ.blocks keep))\n        (And\n          (Not\n            (List.instMembership.mem σ.blocks\n              (List.filter (fun p => Decidable.decide (Not (List.instMembership.mem keep p)))\n                σ.childPositions)))\n          (And (Eq keep.length 2)\n            (And (Eq (value keep) 4)\n              (∀ (block : List Nat),\n                List.instMembership.mem σ.blocks block →\n                  Eq block.length keep.length → instLENat.le (value block) 3)))))))",
    "approved_by": "codex:01a07c5a-4a94-7173-865c-d990c69ab997",
    "approved_at": "2026-09-07",
    "kind": "refutation",
    "ws": "B",
    "module": "ESBlueprint.B.CtxBoundSameSizeExchangeCounterexample"
  },
  "ErdosSzekeres.ctx_bound_three_way_base_allocation": {
    "type_hash": "b8dcc4311f83a29e",
    "type_pp": "∀ (cl pl k d e : Nat),\n  instLENat.le cl (instHSub.hSub k 1) →\n    instLENat.le pl (instHSub.hSub k 1) →\n      instLENat.le 1 d →\n        instLENat.le d (instHSub.hSub k 2) →\n          instLENat.le 1 e →\n            instLENat.le e (instHSub.hSub k 2) →\n              have B := ErdosSzekeres.Ctx.Context.baseOf;\n              And\n                (instLENat.le\n                  (instHAdd.hAdd\n                    (instHAdd.hAdd\n                      (B\n                        (instMinNat.min\n                          (instMinNat.min (instHSub.hSub cl 1)\n                            (instHSub.hSub (instHSub.hSub k 1) e))\n                          (instHSub.hSub (instHSub.hSub k 2) d))\n                        pl k)\n                      (B (instMinNat.min (instHSub.hSub cl 1) (instHSub.hSub (instHSub.hSub k 1) d))\n                        (instMinNat.min (instHSub.hSub pl 1) e) k))\n                    (B cl (instMinNat.min (instHSub.hSub pl 2) d) k))\n                  (B cl pl k))\n                (instLENat.le\n                  (instHAdd.hAdd\n                    (instHAdd.hAdd\n                      (B cl\n                        (instMinNat.min (instMinNat.min (instHSub.hSub pl 1) e) (instHSub.hSub d 1))\n                        k)\n                      (B (instMinNat.min (instHSub.hSub cl 1) (instHSub.hSub (instHSub.hSub k 1) e))\n                        (instMinNat.min (instHSub.hSub pl 1) d) k))\n                    (B (instMinNat.min (instHSub.hSub cl 2) (instHSub.hSub (instHSub.hSub k 1) d))\n                      pl k))\n                  (B cl pl k))",
    "approved_by": "codex:01a07c5a-4a94-7173-865c-d990c69ab997",
    "approved_at": "2026-09-07",
    "kind": "formalization",
    "ws": "B",
