          (∀ (keep rest : List Nat) (m n : Nat),\n                (∀ (p : Nat),\n                    List.instMembership.mem σ.childPositions p →\n                      List.instMembership.mem keep p → Not (List.instMembership.mem rest p)) →\n                  instLENat.le\n                    (instHAdd.hAdd (potential (σ.part keep ErdosSzekeres.Ctx.Side.lower m))\n                      (potential (σ.part rest ErdosSzekeres.Ctx.Side.upper n)))\n                    (potential σ)))",
