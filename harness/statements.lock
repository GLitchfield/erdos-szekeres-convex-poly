  "ErdosSzekeres.ctx_bound_additive_three_blocks_of_uniform_contraction": {
    "type_hash": "6db8362d757443e2",
    "type_pp": "(∀ (τ : ErdosSzekeres.Ctx.Context),\n    τ.WellFormed →\n      ∀ (left right : List ErdosSzekeres.Ctx.Letter) (r m t : Nat) (side : ErdosSzekeres.Ctx.Side),\n        instLTNat.lt 0 r →\n          instLTNat.lt 0 m →\n            instLTNat.lt 0 t →\n              (∀ (x : ErdosSzekeres.Ctx.Letter),\n                  List.instMembership.mem (instHAppendOfAppend.hAppend left right) x →\n                    Exists fun l =>\n                      Exists fun s =>\n                        And (instLENat.le 2 l) (Eq x (ErdosSzekeres.Ctx.Letter.ext l s))) →\n                Eq τ.word\n                    (instHAppendOfAppend.hAppend\n                      (instHAppendOfAppend.hAppend\n                        (instHAppendOfAppend.hAppend\n                          (instHAppendOfAppend.hAppend left\n                            (List.replicate r ErdosSzekeres.Ctx.Letter.child))\n                          (List.replicate m (ErdosSzekeres.Ctx.Letter.ext 1 side)))\n                        (List.replicate t ErdosSzekeres.Ctx.Letter.child))\n                      right) →\n                  Eq τ.bound\n                    { a := τ.a, u := τ.u, k := τ.k,\n                        word :=\n                          instHAppendOfAppend.hAppend\n                            (instHAppendOfAppend.hAppend\n                              (instHAppendOfAppend.hAppend\n                                (instHAppendOfAppend.hAppend left\n                                  (List.cons ErdosSzekeres.Ctx.Letter.child List.nil))\n                                (List.replicate m (ErdosSzekeres.Ctx.Letter.ext 1 side)))\n                              (List.cons ErdosSzekeres.Ctx.Letter.child List.nil))\n                            right,\n                        maxima := τ.maxima }.bound) →\n  ∀ (σ : ErdosSzekeres.Ctx.Context),\n    σ.WellFormed →\n      ∀ (b l m r : Nat),\n        Eq σ.childPositions (List.range' b (instHAdd.hAdd (instHAdd.hAdd l m) r)) →\n          instLTNat.lt 0 l →\n            instLTNat.lt 0 m →\n              instLTNat.lt 0 r →\n                ∀ (d : Nat),\n                  instLENat.le 1 d →\n                    instLENat.le d (instHSub.hSub σ.k 2) →\n                      And\n                        (instLENat.le\n                          (instHAdd.hAdd\n                            (σ.part\n                                (instHAppendOfAppend.hAppend (List.range' b l)\n                                  (List.range' (instHAdd.hAdd (instHAdd.hAdd b l) m) r))\n                                ErdosSzekeres.Ctx.Side.lower d).bound\n                            (σ.part (List.range' (instHAdd.hAdd b l) m) ErdosSzekeres.Ctx.Side.upper\n                                (instHSub.hSub (instHSub.hSub σ.k 1) d)).bound)\n                          σ.bound)\n                        (instLENat.le\n                          (instHAdd.hAdd\n                            (σ.part\n                                (instHAppendOfAppend.hAppend (List.range' b l)\n                                  (List.range' (instHAdd.hAdd (instHAdd.hAdd b l) m) r))\n                                ErdosSzekeres.Ctx.Side.upper\n                                (instHSub.hSub (instHSub.hSub σ.k 1) d)).bound\n                            (σ.part (List.range' (instHAdd.hAdd b l) m) ErdosSzekeres.Ctx.Side.lower\n                                d).bound)\n                          σ.bound)",
