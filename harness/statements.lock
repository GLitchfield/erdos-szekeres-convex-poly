    "type_pp": "∀ (σ : ErdosSzekeres.Ctx.Context),\n  σ.WellFormed →\n    ∀ (keep : List Nat),\n      (∀ (p : Nat), List.instMembership.mem keep p → List.instMembership.mem σ.childPositions p) →\n        Ne keep List.nil →\n          instLTNat.lt keep.length σ.childPositions.length →\n            ∀ (d : Nat),\n              instLENat.le 1 d →\n                instLENat.le d (instHSub.hSub σ.k 2) →\n                  And\n                    (instLENat.le\n                      (instHAdd.hAdd (σ.part keep ErdosSzekeres.Ctx.Side.lower d).bound\n                        (σ.part\n                            (List.filter\n                              (fun p => Decidable.decide (Not (List.instMembership.mem keep p)))\n                              σ.childPositions)\n                            ErdosSzekeres.Ctx.Side.upper\n                            (instHSub.hSub (instHSub.hSub σ.k 1) d)).bound)\n                      σ.bound)\n                    (instLENat.le\n                      (instHAdd.hAdd\n                        (σ.part keep ErdosSzekeres.Ctx.Side.upper\n                            (instHSub.hSub (instHSub.hSub σ.k 1) d)).bound\n                        (σ.part\n                            (List.filter\n                              (fun p => Decidable.decide (Not (List.instMembership.mem keep p)))\n                              σ.childPositions)\n                            ErdosSzekeres.Ctx.Side.lower d).bound)\n                      σ.bound)",
    "approved_by": "fable (provisional; Gavin to confirm via CODEOWNERS review)",
    "approved_at": "2026-09-06",
    "kind": "conjecture",
    "ws": "B",
    "module": "ESBlueprint.B.CtxBoundAdditive"
