                 instLENat.le ρ.bound\n                                                              (instHPow.hPow\n                                                                (instHSub.hSub\n                                                                  (ErdosSzekeres.ctx_endpoint_cut_square_of_bounded_bare_square.match_1\n                                                                    (fun t => Nat) t (fun _ => ρ.u)\n                                                                    fun _ => ρ.a)\n                                                                  1)\n                                                                2)) →\n                                        And\n                                          (∀ (f g : Nat),\n                                            instLENat.le\n                                              (instHAdd.hAdd\n                                                (ErdosSzekeres.Ctx.Context.boundFuel f\n                                                  (σ.part keep s m))\n                                                (ErdosSzekeres.Ctx.Context.boundFuel g\n                                                  (σ.part rest t n)))\n                                              (instHPow.hPow w 2))\n                                          (instLENat.le\n                                            (instHAdd.hAdd (σ.part keep s m).bound\n                                              (σ.part rest t n).bound)\n                                            (instHPow.hPow w 2))",
