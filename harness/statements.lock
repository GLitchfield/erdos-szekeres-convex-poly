  "ErdosSzekeres.ctx_satisfies_of_deepBelowSplit": {
    "type_hash": "518bec9af5817021",
    "type_pp": "∀ {n : Nat} {χ : ErdosSzekeres.TripleColoring n} {S lower upper : Finset (Fin n)}\n  (σ : ErdosSzekeres.Ctx.Context),\n  σ.WellFormed →\n    ErdosSzekeres.Ctx.Satisfies χ S σ →\n      ErdosSzekeres.HasDeepBelowSplit χ lower upper →\n        Eq (Finset.instUnion.union lower upper) S →\n          lower.Nonempty →\n            upper.Nonempty →\n              And\n                (ErdosSzekeres.Ctx.Satisfies χ lower\n                  (σ.part (σ.positionsOf S lower) ErdosSzekeres.Ctx.Side.lower\n                    (ErdosSzekeres.Ctx.chainMax χ upper Bool.false)))\n                (ErdosSzekeres.Ctx.Satisfies χ upper\n                  (σ.part (σ.positionsOf S upper) ErdosSzekeres.Ctx.Side.upper\n                    (ErdosSzekeres.Ctx.chainMax χ lower Bool.true)))",
    "approved_by": "fable (provisional; Gavin to confirm via CODEOWNERS review)",
    "approved_at": "2026-09-06",
