  },
  "ErdosSzekeres.rank_pair_clipped_interval_union_missing_corner": {
    "type_hash": "dcc984e48d27dc8e",
    "type_pp": "∀ (a b : Nat),\n  instLTNat.lt a b →\n    have I := Finset.Icc a b;\n    have L := Finset.Icc a (instHSub.hSub b 1);\n    have R := Finset.Icc (instHAdd.hAdd a 1) b;\n    have pairs := fun S => Finset.filter (fun z => instLENat.le z.fst z.snd) (S.product S);\n    And (Eq (Finset.instUnion.union (pairs L) (pairs R)) ((pairs I).erase { fst := a, snd := b }))\n      (Eq\n        (instHAdd.hAdd\n          (instHAdd.hAdd (pairs L).card (Finset.instUnion.union (pairs L) (pairs R)).card) 1)\n        (instHPow.hPow I.card 2))",
    "approved_by": "user:2026-09-09 fresh 12-hour autonomous lemma-driven research run",
    "approved_at": "2026-09-09",
