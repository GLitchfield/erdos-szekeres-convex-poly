    "type_hash": "252d53ad6dd214d2",
    "type_pp": "have σ :=\n  { a := 3, u := 3, k := 3,\n    word :=\n      List.cons ErdosSzekeres.Ctx.Letter.child\n        (List.cons (ErdosSzekeres.Ctx.Letter.ext 1 ErdosSzekeres.Ctx.Side.lower)\n          (List.cons ErdosSzekeres.Ctx.Letter.child List.nil)),\n    maxima := List.cons 1 List.nil };\nAnd σ.WellFormed\n  (And (Eq (σ.part (List.cons 0 List.nil) ErdosSzekeres.Ctx.Side.lower 1).bound 0)\n    (And (Eq (σ.part (List.cons 2 List.nil) ErdosSzekeres.Ctx.Side.upper 1).bound 1)\n      (Eq σ.bound 1)))",
