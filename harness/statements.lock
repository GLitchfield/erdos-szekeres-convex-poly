r p)) 0 p) 1) (rank (color p)))\n                        (Eq (instHAdd.hAdd (rank (color p)) (σ.rightExt (axis (color p)) 0 p))\n                          (instHSub.hSub\n                            ((fun v =>\n                                ErdosSzekeres.ctx_mixed_clear_or_singleton_rank_cover_potential.match_1\n                                  (fun v => Nat) v (fun _ => σ.u) fun _ => σ.a)\n                              (axis (color p)))\n                            1))) →\n            have active := fun ρ =>\n              Finset.filter\n                (fun p => And (instLTNat.lt 0 (ρ.cupLimit p p)) (instLTNat.lt 0 (ρ.capLimit p p)))\n                ρ.childPositions.toFinset;\n            have potential := fun ρ => (Finset.image color (active ρ)).card;\n            And\n              (∀ (fuel : Nat),\n                instLENat.le (ErdosSzekeres.Ctx.Context.boundFuel fuel σ) (potential σ))\n              (And (instLENat.le σ.bound (potential σ))\n                (∀ (keep rest : List Nat) (m n : Nat),\n                  (∀ (p : Nat),\n                      List.instMembership.mem σ.childPositions p →\n                        List.instMembership.mem keep p → Not (List.instMembership.mem rest p)) →\n                    instLENat.le\n                      (instHAdd.hAdd (potential (σ.part keep ErdosSzekeres.Ctx.Side.lower m))\n                        (potential (σ.part rest ErdosSzekeres.Ctx.Side.upper n)))\n                      (potential σ)))",
