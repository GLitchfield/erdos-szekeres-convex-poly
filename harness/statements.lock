    "type_pp": "∀ (σ : ErdosSzekeres.Ctx.Context),\n  (∀ (p j : Nat) (v : ErdosSzekeres.Ctx.Side),\n      Eq (σ.letterAt p) (ErdosSzekeres.Ctx.Letter.ext j v) → instLENat.le 1 j) →\n    ∀ (s t : ErdosSzekeres.Ctx.Side),\n      Ne s t →\n        ∀ (N M x y : Nat),\n          List.instMembership.mem σ.levels N →\n            List.instMembership.mem σ.levels M →\n              instLTNat.lt N M →\n                Eq (σ.sideAt N) s →\n                  Eq (σ.sideAt M) s →\n                    List.instMembership.mem (σ.extPositions N) x →\n                      List.instMembership.mem (σ.extPositions M) y →\n                        instLENat.le\n                            (ErdosSzekeres.ctx_cut_rank_budget_of_nonunit_part.match_1\n                              (fun s => Nat) s (fun _ => σ.u) fun _ => σ.a)\n                            4 →\n                          ∀ (keep : List Nat) (m n p q : Nat),\n                            List.instMembership.mem (σ.part keep s m).childPositions p →\n                              instLENat.le 2\n                                  (ErdosSzekeres.ctx_cut_rank_budget_of_nonunit_part.match_1\n                                    (fun s => Nat) s (fun _ => (σ.part keep s m).cupLimit p p)\n                                    fun _ => (σ.part keep s m).capLimit p p) →\n                                List.instMembership.mem σ.childPositions q →\n                                  Not (List.instMembership.mem keep q) →\n                                    have ownPart := σ.part keep s m;\n                                    have otherPart :=\n                                      σ.part\n                                        (List.filter\n                                          (fun x =>\n                                            Decidable.decide (Not (List.instMembership.mem keep x)))\n                                          σ.childPositions)\n                                        t n;\n                                    have budget :=\n                                      instHSub.hSub\n                                        (ErdosSzekeres.ctx_cut_rank_budget_of_nonunit_part.match_1\n                                          (fun t => Nat) t (fun _ => σ.u) fun _ => σ.a)\n                                        1;\n                                    have active :=\n                                      Finset.filter\n                                        (fun p =>\n                                          And (instLTNat.lt 0 (σ.cupLimit p p))\n                                            (instLTNat.lt 0 (σ.capLimit p p)))\n                                        σ.childPositions.toFinset;\n                                    have ranks :=\n                                      active.biUnion fun p =>\n                                        Finset.Icc (instHAdd.hAdd (σ.leftExt t 0 p) 1)\n                                          (instHSub.hSub budget (σ.rightExt t 0 p));\n                                    And\n                                      (∀ (fuel : Nat),\n                                        instLENat.le\n                                          (ErdosSzekeres.Ctx.Context.boundFuel fuel ownPart)\n                                          ranks.card)\n                                      (And (instLENat.le ownPart.bound ranks.card)\n                                        (And\n                                          (∀ (fuel : Nat),\n                                            instLENat.le\n                                              (ErdosSzekeres.Ctx.Context.boundFuel fuel otherPart)\n                                              1)\n                                          (instLENat.le otherPart.bound 1)))",
