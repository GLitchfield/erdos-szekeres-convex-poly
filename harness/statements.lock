    "type_pp": "∀ (σ : ErdosSzekeres.Ctx.Context),\n  σ.WellFormed →\n    ∀ (b l m r : Nat),\n      Eq σ.childPositions (List.range' b (instHAdd.hAdd (instHAdd.hAdd l m) r)) →\n        instLTNat.lt 0 l →\n          instLTNat.lt 0 m →\n            instLTNat.lt 0 r →\n              have τ :=\n                { a := σ.a, u := σ.u, k := σ.k,\n                  word :=\n                    instHAppendOfAppend.hAppend\n                      (instHAppendOfAppend.hAppend (List.take b σ.word)\n                        (List.replicate (instHAdd.hAdd (instHAdd.hAdd l 1) r)\n                          ErdosSzekeres.Ctx.Letter.child))\n                      (List.drop (instHAdd.hAdd b (instHAdd.hAdd (instHAdd.hAdd l m) r)) σ.word),\n                  maxima := σ.maxima };\n              And τ.WellFormed\n                (And (Eq τ.childPositions (List.range' b (instHAdd.hAdd (instHAdd.hAdd l 1) r)))\n                  (And (Eq σ.bound τ.bound)\n                    (∀ (s : ErdosSzekeres.Ctx.Side) (q : Nat),\n                      instLENat.le 1 q →\n                        instLENat.le q (instHSub.hSub σ.k 2) →\n                          And\n                            (Eq\n                              (σ.part\n                                  (instHAppendOfAppend.hAppend (List.range' b l)\n                                    (List.range' (instHAdd.hAdd (instHAdd.hAdd b l) m) r))\n                                  s q).bound\n                              (τ.part\n                                  (instHAppendOfAppend.hAppend (List.range' b l)\n                                    (List.range' (instHAdd.hAdd (instHAdd.hAdd b l) 1) r))\n                                  s q).bound)\n                            (Eq (σ.part (List.range' (instHAdd.hAdd b l) m) s q).bound\n                              (τ.part (List.cons (instHAdd.hAdd b l) List.nil) s q).bound))))",
