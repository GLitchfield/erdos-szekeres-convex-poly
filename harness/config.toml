# es harness configuration for erdos-szekeres-convex-poly.
# Everything project-specific lives here; tools/es/ is generic.

[project]
id = "erdos-szekeres"                  # keys <es_home>/<id>/es.db and the taint cache
es_home = ".es"                        # harness state inside the checkout (gitignored): sandboxed agents (Codex
                                       # workspace-write) may only write here; ~/.es/erdos-szekeres is a symlink to it
blueprint_namespace = "ESBlueprint"    # module prefix of node modules
blueprint_root = "ESBlueprint.lean"
core_namespace = "ErdosSzekeres"       # Lean namespace of node declarations and of the core library
core_root_module = "ErdosSzekeres"     # module whose import closure is "ESCore"
closed_target_default = "ErdosSzekeres.Closed"
workstreams = ["A", "B", "C", "D", "E", "F", "G"]

[git]
git_dir = ".git-data"                  # this checkout mounts .git read-only; metadata lives here
default_branch = "main"
remote = "origin"

[layers]
# Earlier layers may not import later ones unless a rule below says otherwise.
# ESEncodings = the hand-written modules the generated certificate modules import
# directly (encodings, presentations, LRATCheckpoint, support glue), pinned in
# harness/encodings.txt. Their whole hand-written import closure is FROZEN: editing any
# module in it invalidates every certificate built on it (125 GB of oleans), so
# `es layers` fails on such a diff unless the commit carries the marker
# [certificate-rebuild] (the pre-bash hook passes --allow-rebuild) or ES_CERTIFICATE_REBUILD=1.
order = ["ESEncodings", "ESCertificates", "ESCore", "ESBlueprint"]
core = "ESCore"
blueprint = "ESBlueprint"
certificates = "ESCertificates"

[layers.ESEncodings]
prefixes = ["ErdosSzekeres"]
inputs_of = "ESCertificates"           # computed from the import graph ...
members_file = "harness/encodings.txt" # ... and pinned here (`es layers --write-allowlists` regenerates)
frozen_closure = true                  # freeze the transitive closure, not just the direct inputs

[layers.ESCertificates]
prefixes = ["ErdosSzekeres"]
generated = true                       # claims the modules matching [certificates] below

[layers.ESCore]
prefixes = ["ErdosSzekeres"]

[layers.ESBlueprint]
prefixes = ["ESBlueprint"]
exclude_from_root = ["ESBlueprint.Extract"]

# Modules that consume certificates are allowlisted explicitly (`es layers
# --write-allowlists` regenerates the file); some encoding-layer "support" modules sit
# between two generated layers and consume certificates too. Certificates may import
# ESEncodings freely (earlier layer) and nothing else.
[[layers.rules]]
from = "ESCore"
to = "ESCertificates"
allow = "importers"                    # the importing module must be listed
file = "harness/certificate_consumers.txt"

[[layers.rules]]
from = "ESEncodings"
to = "ESCertificates"
allow = "importers"
file = "harness/certificate_consumers.txt"

# Certificate families are stacked (one family's consumer is another family's
# encoding input), so encodings may import core modules; what protects the
# certificates is the frozen closure above, not an import direction.
[[layers.rules]]
from = "ESEncodings"
to = "ESCore"
allow = "any"

[certificates]
# A module under ErdosSzekeres is a generated certificate module when its path
# (relative to ErdosSzekeres/) matches one of these globs or its header carries
# the generator marker.  The same criteria drive `es certs relocate`.
generated_patterns = [
  "*CNFChunk*", "*CNFRaw*", "*CNFMid*", "*CNFGenerated", "*CNFDefs", "*CNFNamed*", "*CNFSemantics", "*CNFUnsat",
  "*CheckpointSegment*", "*CheckpointContext", "*CheckpointData/*",
  "*SemanticSegment*", "*SupportSegment*", "*ClauseChunk*",
  "*SemanticChunk*", "*SemanticElim*", "*SemanticBranchV*", "*SemanticAtomSegment*",
  "*SemanticCommonClauseSegment*", "*SemanticVaryingClauseSegment*",
  "*Clause??Chunk??", "*StrongClause??Clause??", "*StrongClause??Clause??Final", "*TwoSegment???",
]
generated_marker = "generated by|do not edit|this file is generated"
marker_lines = 12

[audit]
standard_axioms = ["propext", "Classical.choice", "Quot.sound"]
destinations_file = "harness/destinations.txt"
allowlist_file = "harness/allowlist.json"

[build]
lake = "lake"
core_budget_min = 10
guard = true                           # run lake inside a transient user cgroup (systemd-run --scope)
memory_max = "20G"                     # MemoryMax for one build; Fin13 clause chunks need ~15 GiB each
cpu_quota_cores = 0                    # 0 = no CPU quota
lean_threads = 0                       # 0 = Lean's default
serial_missing = true                  # build Lake's out-of-date list before the full target, round by round
                                       # (Lake 5 has no -j; parallel compilers of big modules exhaust RAM)
serial_rounds = 5000                   # chains are deep (192 checkpoint segments import each other)
batch_small = 6                        # independent small chain heads per lake invocation
heavy_patterns = ["*CheckpointSegment*", "*CheckpointContext", "*CNFRaw*", "*CNFMid*"]  # always alone
memory_max_retry = "30G"               # a single module that hits memory_max is retried once with this cap
memory_max_final = "30G"               # the final parallel step (the root module maps every olean)
[[build.memory_overrides]]             # modules known to need more than memory_max on their own
pattern = "ErdosSzekeres.StructuralChargingNextState578UpperBracketFanCounterexample"
memory_max = "28G"

[build.targets]
core = ["ESCore"]
blueprint = ["ESBlueprint"]
certs = ["ESCore"]                     # until the certificate modules move into their own lean_lib
[build.target_roots]
ESCore = "ErdosSzekeres"
ESBlueprint = "ESBlueprint"

[extract]
script = "ESBlueprint/Extract.lean"    # materialized from tools/es/lean/Extract.lean.tmpl
imports = ["ESBlueprint", "ErdosSzekeres"]
memory_max = "36G"                     # the environment maps every olean; proof terms are read once, sequentially
budget_min = 180
index_layers = ["ESCore", "ESEncodings"]  # layers whose declarations go into index.json (certificates excluded)
missing_destinations = "error"

[claims]
ttl_hours = 12
require_why = true                     # `es claim --why "..."`: the intent is shown in `es status`

[falsify]
falsifiers_dir = "harness/falsifiers"
dataset_dir = "harness/dataset"
results_dir = "harness/falsify"
timeout_min = 60
memory_max = "24G"                     # falsifiers run SAT solvers and enumerations: same guard as builds

[jobs]
max_parallel_builds = 1
max_parallel_falsifiers = 2
memory_budget = "30G"                  # sum of the caps of live jobs (`es job run`, async build/check/falsify);
                                       # the host has 64 GB, Windows keeps ~25 GB, so the VM should not exceed ~30 GB
default_memory_max = "2G"              # cap for `es job run` when --mem is not given
run_margin_gib = 2                     # `es job run` needs cap + margin GiB available when submitted
output_roots = ["runs", "data"]        # `es job run --out` paths must lie under one of these

[node]
default_import = "ErdosSzekeres"       # narrower imports keep `es check` fast; override per node with --import
