# es harness configuration for erdos-szekeres-convex-poly.
# Everything project-specific lives here; tools/es/ is generic.

[project]
id = "erdos-szekeres"                  # keys ~/.es/<id>/es.db and the taint cache
blueprint_namespace = "ESBlueprint"    # module prefix of node modules
blueprint_root = "ESBlueprint.lean"
core_namespace = "ErdosSzekeres"       # Lean namespace of node declarations and of the core library
core_root_module = "ErdosSzekeres"     # module whose import closure is "ESCore"
closed_target_default = "ErdosSzekeres.Closed"
workstreams = ["A", "B", "C", "D", "E", "F", "G"]

[git]
git_dir = ".git-data"                  # this checkout mounts .git read-only; metadata lives here
default_branch = "main"
remote = "origin"

[layers]
# Earlier layers may not import later ones unless a rule below says otherwise.
order = ["ESCertificates", "ESCore", "ESBlueprint"]
core = "ESCore"
blueprint = "ESBlueprint"
certificates = "ESCertificates"

[layers.ESCertificates]
prefixes = ["ErdosSzekeres"]
generated = true                       # claims the modules matching [certificates] below

[layers.ESCore]
prefixes = ["ErdosSzekeres"]

[layers.ESBlueprint]
prefixes = ["ESBlueprint"]
exclude_from_root = ["ESBlueprint.Extract"]

# Certificates sit between core definitions (encodings, presentations) and core
# consumers, so both directions across the ESCore/ESCertificates boundary are
# allowlisted explicitly.  `es layers --write-allowlists` regenerates the files.
[[layers.rules]]
from = "ESCore"
to = "ESCertificates"
allow = "importers"                    # the importing core module must be listed
file = "harness/certificate_consumers.txt"

[[layers.rules]]
from = "ESCertificates"
to = "ESCore"
allow = "imported"                     # the imported core module must be listed
file = "harness/certificate_inputs.txt"

[certificates]
# A module under ErdosSzekeres is a generated certificate module when its path
# (relative to ErdosSzekeres/) matches one of these globs or its header carries
# the generator marker.  The same criteria drive `es certs relocate`.
generated_patterns = [
  "*CNFChunk*", "*CNFRaw*", "*CNFMid*", "*CNFGenerated", "*CNFDefs", "*CNFNamed*", "*CNFSemantics", "*CNFUnsat",
  "*CheckpointSegment*", "*CheckpointContext", "*CheckpointData/*",
  "*SemanticSegment*", "*SupportSegment*", "*ClauseChunk*",
  "*SemanticChunk*", "*SemanticElim*", "*SemanticBranchV*", "*SemanticAtomSegment*",
  "*SemanticCommonClauseSegment*", "*SemanticVaryingClauseSegment*",
  "*Clause??Chunk??", "*StrongClause??Clause??", "*StrongClause??Clause??Final", "*TwoSegment???",
]
generated_marker = "generated by|do not edit|this file is generated"
marker_lines = 12

[audit]
standard_axioms = ["propext", "Classical.choice", "Quot.sound"]
destinations_file = "harness/destinations.txt"
allowlist_file = "harness/allowlist.json"

[build]
lake = "lake"
core_budget_min = 10
guard = true                           # run lake inside a transient user cgroup (systemd-run --scope)
memory_max = "20G"                     # MemoryMax for one build; Fin13 clause chunks need ~15 GiB each
cpu_quota_cores = 0                    # 0 = no CPU quota
lean_threads = 0                       # 0 = Lean's default
serial_missing = true                  # build modules with no olean one at a time before the full target
                                       # (Lake 5 has no -j; parallel compilers of big modules exhaust RAM)

[build.targets]
core = ["ESCore"]
blueprint = ["ESBlueprint"]
certs = ["ESCore"]                     # until the certificate modules move into their own lean_lib
[build.target_roots]
ESCore = "ErdosSzekeres"
ESBlueprint = "ESBlueprint"

[extract]
script = "ESBlueprint/Extract.lean"    # materialized from tools/es/lean/Extract.lean.tmpl
# Normally ["ESBlueprint", "ErdosSzekeres"] (the whole core). TEMPORARY (2026-09-04): the
# core root is out of date (318-module certificate rebuild pending Gavin's go-ahead, see
# docs/harness-implementation-2026-09-04.md), so the extractor imports the destination
# theorems' modules directly; restore the root once `es build core` has completed.
imports = ["ESBlueprint", "ErdosSzekeres.SmallCases", "ErdosSzekeres.ES5Certificate", "ErdosSzekeres.ES6Certificate", "ErdosSzekeres.Extremal", "ErdosSzekeres.TothValtrUpper", "ErdosSzekeres.SukPositiveFractionExplicitUpper", "ErdosSzekeres.HMPTExplicitUpper", "ErdosSzekeres.StrongPredecessorBaseSixThroughFourteen", "ErdosSzekeres.PredecessorHalfSix", "ErdosSzekeres.DecompositionPrimeNormalization", "ErdosSzekeres.StrongPredecessorBicoloring", "ErdosSzekeres.CommonAnchorPermutationOrder"]
memory_max = "36G"                     # the environment maps every olean; proof terms are read once, sequentially
budget_min = 180
index_layers = ["ESCore"]              # layers whose declarations go into index.json (certificates excluded)
# TEMPORARY (2026-09-04): two destinations live on the E3State466 side of the StrongSixValues
# clash and cannot be imported together with the ES(6) certificate; report them as warnings
# instead of failing `es extract --check`. Set back to "error" once the clash is fixed.
missing_destinations = "warn"

[claims]
ttl_hours = 12

[falsify]
falsifiers_dir = "harness/falsifiers"
dataset_dir = "harness/dataset"
results_dir = "harness/falsify"
timeout_min = 60

[jobs]
max_parallel_builds = 1
max_parallel_falsifiers = 2

[node]
default_import = "ErdosSzekeres"       # narrower imports keep `es check` fast; override per node with --import
