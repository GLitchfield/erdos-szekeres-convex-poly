[project]
name = "es-harness"
version = "0.1.0"
description = "Blueprint harness: project state derived from the compiled Lean environment"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
test = ["pytest"]

[project.scripts]
es = "es.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["es*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
