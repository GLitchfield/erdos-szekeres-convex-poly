schema_version = 1
orchestrator = "principal_orchestrator"
wayfinder_map = "docs/wayfinder/map.md"
frontier_portfolio = "docs/wayfinder/frontier-portfolio.md"
research_campaign_protocol = "docs/agents/research-campaign.md"
research_seed_schema = "docs/agents/schemas/research-seed-batch.schema.json"
research_development_brief_schema = "docs/agents/schemas/research-development-brief.schema.json"
research_development_receipt_schema = "docs/agents/schemas/research-development-receipt.schema.json"
research_campaign_checker = ["python3", "scripts/check_research_campaign.py", "--templates"]
research_scheduler_protocol = "docs/agents/research-scheduler.md"
research_scheduler_dispatch_schema = "docs/agents/schemas/research-scheduler-dispatch.schema.json"
research_scheduler_reserve_schema = "docs/agents/schemas/research-scheduler-reserve.schema.json"
wayfinder_thread_lifecycle_schema = "docs/agents/schemas/wayfinder-thread-lifecycle.schema.json"
research_scheduler_entrypoint = ["python3", "scripts/research_scheduler.py"]
wayfinder_thread_lifecycle_checker = ["python3", "scripts/check_wayfinder_thread_lifecycle.py", "check"]
research_scheduler_acceptance_checker = ["python3", "scripts/check_research_scheduler_acceptance.py"]
wayfinder_status = ["python3", "scripts/wayfinder_status.py"]
file_proof_gate = ["lake", "env", "lean"]
project_proof_gate = ["lake", "build"]
repository_gate = ["make", "test"]

[policy]
max_parallel_workers = 4
max_parallel_specialists = 4
max_parallel_builders = 1
max_delegation_depth = 1
default_wall_minutes = 30
default_cpu_cores = 8
default_memory_gib = 16
default_output_gib = 5
runtime_root = "runs/agents"
task_packets_immutable_after_dispatch = true
orchestrator_owned = [
  "AGENTS.md",
  "ErdosSzekeres.lean",
  "Makefile",
  "README.md",
  "docs/agents/**",
  "docs/wayfinder/**",
  "docs/formalization_plan.md",
  "docs/literature_review.md",
]
claim_levels = [
  "proposal",
  "computational_evidence",
  "file_compiles",
  "project_builds",
  "repository_tests_pass",
  "kernel_checked_counterexample",
]
result_statuses = [
  "completed",
  "refuted",
  "blocked",
  "inconclusive",
  "superseded",
]

[[profiles]]
id = "principal_orchestrator"
display_name = "Principal Research Orchestrator"
kind = "orchestrator"
path = "docs/agents/profiles/principal-orchestrator.md"
default_mode = "orchestrator"
allowed_claims = [
  "proposal",
  "computational_evidence",
  "file_compiles",
  "project_builds",
  "repository_tests_pass",
  "kernel_checked_counterexample",
]

[[profiles]]
id = "adversarial_math_copilot"
display_name = "Laplace"
