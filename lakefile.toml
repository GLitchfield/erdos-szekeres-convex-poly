name = "erdos_szekeres_convex_poly"
version = "0.1.0"
defaultTargets = ["ESCore"]
# Keep every cached compiled facet at its normal build path for editors and the
# harness.  Cache writes are enabled only by guarded commands via environment.
restoreAllArtifacts = true

# ESCore: the hand-written development rooted at ErdosSzekeres.lean, together with
# the generated certificate modules it imports (they share the ErdosSzekeres.*
# namespace until they are relocated; see docs/harness-design.md §4 and
# `es certs relocate`).  Layering between core and certificates is enforced by
# `es layers`, not by Lake.
[[lean_lib]]
name = "ESCore"
roots = ["ErdosSzekeres"]
weakLeanArgs = ["--tstack=65536"]

# ESBlueprint: one module per open node; `sorry` is allowed here and nowhere else.
[[lean_lib]]
name = "ESBlueprint"
roots = ["ESBlueprint"]
weakLeanArgs = ["--tstack=65536"]

[[require]]
name = "Hammer"
git = "https://github.com/JOSHCLUNE/LeanHammer"
rev = "6ea795e19edb540a55e16dd4fed1a263324909b8"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.1"
